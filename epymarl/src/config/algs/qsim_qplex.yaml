# --- QSIM-QPLEX specific parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000
evaluation_epsilon: 0.0

runner: "episode"

buffer_size: 5000

# update the target network every {} episodes
target_update_interval_or_tau: 200

obs_agent_id: True
obs_last_action: False
obs_individual_obs: False

standardise_returns: False
standardise_rewards: True

# use the qsim_qplex_learner to train
agent_output_type: "q"
learner: "qsim_qplex_learner"
double_q: True
mixer: "dmaq"
use_rnn: False
mixing_embed_dim: 32
hypernet_embed: 64
adv_hypernet_layers: 1
adv_hypernet_embed: 64

num_kernel: 4
is_minus_one: True
weighted_head: True
is_adv_attention: True
is_stop_gradient: True

burn_in_period: 100

# Qsim parameters
ae_hidden_dim: 128
k_softmax: 3
similar_threshold: 0

name: "qsim_qplex"
