# --- QSIM-VDN specific parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000
evaluation_epsilon: 0.0

runner: "episode"

buffer_size: 5000

# update the target network every {} episodes
target_update_interval_or_tau: 200


obs_agent_id: True
obs_last_action: False
obs_individual_obs: False


# use the qsim_qmix_learner to train
standardise_returns: False
standardise_rewards: True

agent_output_type: "q"
learner: "qsim_qmix_learner"
double_q: True
mixer: "vdn"
use_rnn: False

# Qsim parameters
ae_hidden_dim: 128
k_softmax: 3
similar_threshold: 0

name: "qsim_vdn"
